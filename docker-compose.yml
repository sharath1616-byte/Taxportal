version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: taxportal-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=taxportal_pro
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - taxportal-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taxportal-backend
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://admin:password123@mongodb:27017/taxportal_pro?authSource=admin
      - DB_NAME=taxportal_pro
      - CORS_ORIGINS=http://localhost:3000
      - SECRET_KEY=your-jwt-secret-key-change-in-production
      - EMERGENT_LLM_KEY=sk-emergent-99bA44eAeA69c2eBd1
      - SENDGRID_API_KEY=your-sendgrid-api-key
      - SENDER_EMAIL=noreply@taxportal.com
      - STRIPE_API_KEY=sk_test_emergent
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    networks:
      - taxportal-network
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taxportal-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - taxportal-network
    command: npm start

volumes:
  mongodb_data:

networks:
  taxportal-network:
    driver: bridge